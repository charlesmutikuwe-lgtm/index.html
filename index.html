<html lang="en">
<head>

<title>Varsity Visa StudyMatch</title>
<style>
:root {
  --navy:#0b1f4d; --navy2:#132b67; --navy3:#1c3f8f; --red:#d42424; --red2:#aa1717;
  --white:#ffffff; --off:#f4f7fb; --slate:#64748b; --line:#e2e8f0; --green:#15803d; --gold:#b45309;
  --shadow:0 14px 42px rgba(11,31,77,.13); --soft:0 4px 18px rgba(11,31,77,.08);
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,system-ui,-apple-system,sans-serif;background:var(--off);color:#0f172a} a{color:inherit}
.app{max-width:1180px;margin:0 auto;min-height:100vh} .mobile{max-width:520px;margin:0 auto;background:var(--off);min-height:100vh}
.hero{background:radial-gradient(circle at 18% 18%, rgba(212,36,36,.30), transparent 25%),linear-gradient(145deg,var(--navy),var(--navy2) 65%,#081634);color:white;padding:28px 18px 36px;border-bottom-left-radius:32px;border-bottom-right-radius:32px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px} .logo{width:48px;height:48px;border-radius:16px;background:white;color:var(--red);display:flex;align-items:center;justify-content:center;font-size:25px;box-shadow:0 10px 28px rgba(0,0,0,.22)}
.brand-title{font-weight:950;letter-spacing:-.02em;font-size:17px} .brand-sub{font-size:10px;color:#cbd5e1;letter-spacing:.12em;text-transform:uppercase}
.hero h1{font-size:36px;line-height:1.04;margin:0 0 14px;font-weight:950;letter-spacing:-.045em} .hero p{font-size:15px;line-height:1.65;color:#dbeafe;margin:0 0 22px;max-width:760px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap} .btn{border:0;border-radius:16px;padding:14px 18px;font-weight:900;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:8px;font-family:inherit;transition:.18s ease;box-shadow:var(--soft)}
.btn:hover{transform:translateY(-1px)} .btn-primary{background:var(--red);color:white} .btn-white{background:white;color:var(--navy)} .btn-navy{background:var(--navy);color:white} .btn-wa{background:#25d366;color:white} .btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--slate);box-shadow:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:26px} .stat{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:14px;text-align:center} .stat b{display:block;font-size:22px;color:white} .stat span{font-size:10px;color:#cbd5e1;text-transform:uppercase;letter-spacing:.08em}
.panel{padding:18px} .card{background:white;border:1px solid var(--line);border-radius:24px;box-shadow:var(--soft);padding:18px} .section-title{font-size:22px;font-weight:950;color:var(--navy);margin:0 0 4px;letter-spacing:-.03em} .muted{color:var(--slate);font-size:13px;line-height:1.55}
.progress-meta{display:flex;justify-content:space-between;color:var(--slate);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;margin:0 0 7px} .progress{height:5px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:18px} .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--red));border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px} .option{background:white;border:2px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;box-shadow:var(--soft);transition:.18s ease} .option:hover,.option.selected{border-color:var(--navy);background:#eef3ff;transform:translateY(-1px)} .option .emoji{font-size:24px;margin-bottom:6px} .option b{display:block;font-size:13px;color:var(--navy);line-height:1.25} .option small{display:block;color:var(--slate);font-size:10px;line-height:1.35;margin-top:4px}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:12px} .field label{font-size:12px;font-weight:900;color:var(--navy)} input,select{width:100%;border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-size:14px;font-family:inherit;outline:none;background:white;color:#0f172a} input:focus,select:focus{border-color:var(--navy);box-shadow:0 0 0 4px rgba(11,31,77,.09)}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;border:1px solid transparent} .b-red{background:#fff1f2;color:var(--red);border-color:#fecdd3} .b-green{background:#ecfdf5;color:var(--green);border-color:#bbf7d0} .b-gold{background:#fffbeb;color:var(--gold);border-color:#fde68a} .b-navy{background:#eef3ff;color:var(--navy);border-color:#c7d2fe} .b-grey{background:#f8fafc;color:var(--slate);border-color:var(--line)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px} .kpi{background:white;border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:var(--soft)} .kpi small{display:block;color:var(--slate);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em} .kpi b{display:block;color:var(--navy);font-size:20px;margin-top:4px}
.result{background:white;border:1px solid var(--line);border-radius:26px;box-shadow:var(--soft);margin-bottom:14px;overflow:hidden} .result-head{background:linear-gradient(135deg,var(--navy),var(--navy2));color:white;padding:16px} .result-top{display:flex;justify-content:space-between;gap:14px} .result h3{margin:8px 0 4px;font-size:18px;line-height:1.15;color:white} .result .city{font-size:12px;color:#cbd5e1} .price{font-size:27px;font-weight:950;color:white;text-align:right;white-space:nowrap} .price small{display:block;font-size:10px;font-weight:700;color:#cbd5e1} .result-body{padding:16px} .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px} .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0} .fact{background:var(--off);border-radius:12px;padding:9px;text-align:center} .fact small{display:block;color:var(--slate);font-size:9px;text-transform:uppercase;font-weight:800} .fact b{display:block;color:var(--navy);font-size:11px;margin-top:3px;line-height:1.25} .source{font-size:10px;color:var(--slate);line-height:1.4;margin-top:10px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:9px}
.score-ring{width:62px;height:62px;border-radius:50%;background:conic-gradient(var(--red) var(--pct),rgba(255,255,255,.18) 0);display:flex;align-items:center;justify-content:center;flex:0 0 auto} .score-ring span{width:46px;height:46px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;color:white;font-weight:950;font-size:14px}
.preview-blur{filter:blur(3px);opacity:.52;pointer-events:none} .overlay{position:absolute;left:0;right:0;bottom:0;padding:84px 20px 20px;background:linear-gradient(to top,var(--off) 44%,rgba(244,247,251,0));text-align:center}
.compare-bar{position:sticky;bottom:0;background:rgba(244,247,251,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px;z-index:50;box-shadow:0 -10px 30px rgba(11,31,77,.10)} .compare-pill{display:inline-flex;align-items:center;gap:6px;background:white;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:10px;font-weight:800;margin:0 4px 6px 0}
.modal{position:fixed;inset:0;background:rgba(8,22,52,.62);z-index:100;display:flex;align-items:flex-end;padding:16px} .modal-panel{background:white;border-radius:24px;padding:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;margin:0 auto;box-shadow:0 24px 70px rgba(0,0,0,.30)} table{width:100%;border-collapse:collapse;font-size:11px} th,td{text-align:left;border-bottom:1px solid var(--line);padding:9px 6px;vertical-align:top} th{font-size:9px;text-transform:uppercase;color:var(--slate);letter-spacing:.08em}
.notice{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:16px;padding:12px;font-size:12px;line-height:1.5;margin-bottom:14px} .footer-note{font-size:10px;color:var(--slate);line-height:1.5;background:white;border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:12px}
@media(min-width:820px){.mobile{max-width:100%;background:transparent}.hero{padding:34px 34px 42px}.hero h1{font-size:54px}.panel{padding:28px}.layout{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}.sticky{position:sticky;top:18px}.grid{grid-template-columns:repeat(3,1fr)}}

.field.invalid input{border-color:var(--red)!important;background:#fff5f5!important}
.err{display:none;color:var(--red);font-size:11px;line-height:1.35;margin-top:5px}
.field.invalid .err{display:block}
.hint{font-size:10px;color:var(--slate);line-height:1.35;margin-top:5px}

</style>
</head>

const BUDGETS=[{id:"3500",label:"Under $3,500 / year",max:3500,tag:"Most affordable"},{id:"5000",label:"$3,500 – $5,000 / year",max:5000,tag:"Mid range"},{id:"8000",label:"$5,000 – $8,000 / year",max:8000,tag:"Premium affordable"},{id:"99999",label:"$8,000+ / year",max:99999,tag:"Open budget"}];

const TIMES=[{id:"asap",label:"ASAP",sub:"Within 1–3 months"},{id:"mid",label:"3–6 months",sub:"Planning ahead"},{id:"planned",label:"6–12 months",sub:"Safer planning window"},{id:"flex",label:"12+ months",sub:"Very flexible"}];
const PROGRAM_CATS=[
  ["nursing","🏥","Nursing"],["medicine","⚕️","Medicine"],["dentistry","🦷","Dentistry"],["pharmacy","💊","Pharmacy"],["physiotherapy","🦴","Physiotherapy"],["health","🩺","Health Sciences"],

];
function lower(x){return String(x||"").toLowerCase()}
function categoryOf(p){let s=lower(p.programme); if(s.includes("nursing"))return"nursing"; if(s.includes("medicine")||s.includes("mbbs")||s.includes("md"))return"medicine"; if(s.includes("dent"))return"dentistry"; if(s.includes("pharmacy"))return"pharmacy"; if(s.includes("physio"))return"physiotherapy"; if(s.includes("health")||s.includes("nutrition")||s.includes("dietetics")||s.includes("midwifery"))return"health"; if(s.includes("computer")||s.includes("software")||s.includes("it")||s.includes("data")||s.includes("informatics"))return"computer"; if(s.includes("cyber"))return"cyber"; if(s.includes("engineering")||s.includes("mechanical")||s.includes("civil")||s.includes("electrical"))return"engineering"; if(s.includes("business")||s.includes("management")||s.includes("mba")||s.includes("economics"))return"business"; if(s.includes("finance")||s.includes("accounting"))return"finance"; if(s.includes("hospitality")||s.includes("tourism")||s.includes("hotel"))return"hospitality"; if(s.includes("law"))return"law"; if(s.includes("psychology"))return"psychology"; if(s.includes("aviation")||s.includes("pilot"))return"aviation"; if(s.includes("marketing"))return"marketing"; return"other";}
function labelForCat(id){let f=PROGRAM_CATS.find(x=>x[0]===id); return f?f[2]:id}
function emojiForCat(id){let f=PROGRAM_CATS.find(x=>x[0]===id); return f?f[1]:"🎓"}
function money(n){return n?"$"+Number(n).toLocaleString():"TBC"}
function whatsapp(msg){return `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`}
let state={step:0,form:{cat:"nursing",budget:"5000",qual:"a",timeline:"mid",country:"Any",ielts:"No"},lead:{firstName:"",surname:"",whatsapp:"",email:""},results:[],compare:[],selected:null};
function saveLead(){try{let leads=JSON.parse(localStorage.getItem("varsityVisaStudyMatchLeads")||"[]"); leads.push({createdAt:new Date().toISOString(),lead:state.lead,form:state.form,results:state.results.map(r=>({country:r.country,university:r.university,programme:r.programme,tuition:r.tuition,match:r.match}))}); localStorage.setItem("varsityVisaStudyMatchLeads",JSON.stringify(leads));}catch(e){}}
function score(p){let b=BUDGETS.find(x=>x.id===state.form.budget); let sc=38; if(categoryOf(p)===state.form.cat)sc+=25; if(p.tuition&&p.tuition<=b.max)sc+=18; else if(p.tuition&&p.tuition<=b.max*1.15)sc+=10; else sc-=8; if(state.form.country==="Any"||p.country===state.form.country)sc+=8; let entry=lower(p.entry), level=lower(p.level); if(state.form.qual==="o"&&(entry.includes("o-level")||entry.includes("matric")||level.includes("diploma")))sc+=8; if(state.form.qual==="a"&&(entry.includes("a-level")||entry.includes("matric")))sc+=10; if(state.form.qual==="b"&&(level.includes("master")||entry.includes("bachelor")))sc+=12; if(state.form.ielts==="No"&&(lower(p.ielts).includes("not required")||lower(p.ielts).includes("moi")||lower(p.ielts).includes("online")))sc+=7; if(lower(p.scholarship).includes("yes"))sc+=5; if(lower(p.euRecognition).includes("yes"))sc+=4; if(state.form.timeline==="asap"&&p.country==="Poland")sc-=18; if(state.form.timeline==="asap"&&p.country==="Lithuania")sc-=10; return Math.max(28,Math.min(98,Math.round(sc)));}
function getResults(){let b=BUDGETS.find(x=>x.id===state.form.budget); let rows=PROGRAMMES.filter(p=>categoryOf(p)===state.form.cat).filter(p=>state.form.country==="Any"||p.country===state.form.country).filter(p=>!p.tuition||p.tuition<=b.max*1.35).map(p=>({...p,match:score(p)})).sort((a,b)=>b.match-a.match||(a.tuition||999999)-(b.tuition||999999)); return rows.slice(0,18);}
function progress(n){return `<div class="progress-meta"><span>Step ${n} of 4</span><span>${Math.round(n/4*100)}% complete</span></div><div class="progress"><i style="width:${n/4*100}%"></i></div>`}
function landing(){let countries=[...new Set(PROGRAMMES.map(p=>p.country))];return `<div class="hero"><div class="brand"><div class="logo">🎓</div><div><div class="brand-title">Varsity Visa StudyMatch</div><div class="brand-sub">Zimbabwe-focused admissions intelligence</div></div></div><h1>Find the most affordable study abroad option for your budget.</h1><p>Compare programmes, tuition fees, requirements, intakes and visa realities from the original Varsity Visa university database.</p><div class="hero-actions"><button class="btn btn-primary" onclick="go(1)">Start Matching</button><a class="btn btn-white" target="_blank" rel="noopener noreferrer" href="${whatsapp('Hi Varsity Visa, I want help finding an affordable study abroad option.')}">Continue on WhatsApp</a></div><div class="stats"><div class="stat"><b>${PROGRAMMES.length}</b><span>Programmes</span></div><div class="stat"><b>${new Set(PROGRAMMES.map(p=>p.university)).size}</b><span>Institutions</span></div><div class="stat"><b>${countries.length}</b><span>Countries</span></div></div></div><div class="panel"><div class="card"><h2 class="section-title">Cost-first matching</h2><p class="muted">Students usually care about programme + tuition first. This tool captures that intent, scores each match, then collects lead details before showing full results.</p></div></div>`}
function step1(){return `<div class="panel"><div class="card">${progress(1)}<h2 class="section-title">What do you want to study?</h2><p class="muted">Choose the programme area. Results come from your original database.</p><div class="grid" style="margin-top:16px">${PROGRAM_CATS.filter(c=>PROGRAMMES.some(p=>categoryOf(p)===c[0])).map(c=>`<div class="option ${state.form.cat===c[0]?'selected':''}" onclick="setCat('${c[0]}')"><div class="emoji">${c[1]}</div><b>${c[2]}</b><small>${PROGRAMMES.filter(p=>categoryOf(p)===c[0]).length} options available</small></div>`).join('')}</div></div></div>`}
function step2(){return `<div class="panel"><div class="card">${progress(2)}<button class="btn btn-ghost" onclick="go(1)" style="margin-bottom:12px">← Back</button><h2 class="section-title">What is your annual tuition budget?</h2><p class="muted">This filters programmes by yearly tuition, not total living cost.</p><div style="display:grid;gap:10px;margin-top:16px">${BUDGETS.map(b=>`<div class="option ${state.form.budget===b.id?'selected':''}" onclick="setBudget('${b.id}')"><b>${b.label}</b><small>${b.tag}</small></div>`).join('')}</div></div></div>`}
function step3(){return `<div class="panel"><div class="card">${progress(3)}<button class="btn btn-ghost" onclick="go(2)" style="margin-bottom:12px">← Back</button><h2 class="section-title">What is your highest qualification?</h2><p class="muted">This helps estimate whether bachelor, diploma or postgraduate options are realistic.</p><div style="display:grid;gap:10px;margin-top:16px">${QUALS.map(q=>`<div class="option ${state.form.qual===q.id?'selected':''}" onclick="setQual('${q.id}')"><b>${q.label}</b><small>${q.sub}</small></div>`).join('')}</div></div></div>`}
function step4(){let countries=['Any',...new Set(PROGRAMMES.map(p=>p.country))];return `<div class="panel"><div class="card">${progress(4)}<button class="btn btn-ghost" onclick="go(3)" style="margin-bottom:12px">← Back</button><h2 class="section-title">Final preferences</h2><p class="muted">These refine the score but do not permanently block options.</p><div class="field" style="margin-top:16px"><label>Preferred country</label><select onchange="state.form.country=this.value">${countries.map(c=>`<option ${state.form.country===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Do you currently have IELTS?</label><select onchange="state.form.ielts=this.value"><option ${state.form.ielts==='No'?'selected':''}>No</option><option ${state.form.ielts==='Yes'?'selected':''}>Yes</option></select></div><div class="field"><label>When do you want to start?</label><select onchange="state.form.timeline=this.value">${TIMES.map(t=>`<option value="${t.id}" ${state.form.timeline===t.id?'selected':''}>${t.label} — ${t.sub}</option>`).join('')}</select></div><button class="btn btn-primary" onclick="preview()">Find My Matches →</button></div></div>`}
function preview(){state.results=getResults();go(5)}
function previewScreen(){let r=state.results;let countries=[...new Set(r.map(x=>x.country))];return `<div><div class="hero" style="text-align:center;border-radius:0 0 28px 28px"><div style="font-size:48px">🎯</div><h1 style="font-size:30px">We found ${r.length} matches</h1><p>${labelForCat(state.form.cat)} options matching your budget and profile.</p><div class="chips" style="justify-content:center">${countries.slice(0,7).map(c=>`<span class="badge b-navy">${COUNTRY_FLAGS[c]||''} ${c}</span>`).join('')}</div></div><div class="panel" style="position:relative;min-height:380px">${r.slice(0,3).map((u,i)=>smallCard(u,i>0)).join('')}<div class="overlay"><p class="muted">Enter your details to unlock all results and save your profile for follow-up.</p><button class="btn btn-primary" onclick="go(6)">Unlock My Results</button></div></div></div>`}
function smallCard(u,blur){return `<div class="card ${blur?'preview-blur':''}" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:10px"><div><b style="color:var(--navy)">${u.university}</b><div class="muted">${u.city}, ${u.country}</div></div><div style="text-align:right"><b style="font-size:20px;color:var(--navy)">${u.tuitionText||money(u.tuition)}</b><div class="muted">/ year</div></div></div><div class="chips"><span class="badge b-red">${u.match}% match</span><span class="badge b-grey">${u.programme}</span></div></div>`}
function leadScreen(){return `<div class="panel"><div class="card"><h2 class="section-title">Unlock your full results</h2><p class="muted">Please enter accurate details so Varsity Visa can contact you with the correct study options.</p><div style="margin-top:16px">
<div class="field ${state.lead.firstName && !isValidName(state.lead.firstName)?'invalid':''}"><label>First name *</label><input value="${state.lead.firstName}" oninput="state.lead.firstName=this.value;enableLead()" id="firstName" placeholder="e.g. Tawanda"><div class="hint">Minimum 2 letters. Numbers are not accepted.</div><div class="err">Enter a valid first name.</div></div>
<div class="field ${state.lead.surname && !isValidName(state.lead.surname)?'invalid':''}"><label>Surname *</label><input value="${state.lead.surname}" oninput="state.lead.surname=this.value;enableLead()" id="surname" placeholder="e.g. Moyo"><div class="hint">Minimum 2 letters. Numbers are not accepted.</div><div class="err">Enter a valid surname.</div></div>
<div class="field ${state.lead.whatsapp && !isValidPhone(state.lead.whatsapp)?'invalid':''}"><label>WhatsApp number *</label><input value="${state.lead.whatsapp}" oninput="state.lead.whatsapp=this.value;enableLead()" id="wa" placeholder="+263775050990 or 0775050990"><div class="hint">Use a real WhatsApp number, 9–15 digits.</div><div class="err">Enter a valid WhatsApp number.</div></div>
<div class="field ${state.lead.email && !isValidEmail(state.lead.email)?'invalid':''}"><label>Email address *</label><input value="${state.lead.email}" oninput="state.lead.email=this.value;enableLead()" id="email" placeholder="yourname@email.com"><div class="hint">Example: name@gmail.com</div><div class="err">Enter a valid email address.</div></div>
<button id="leadBtn" class="btn btn-primary" onclick="submitLead()" ${isLeadValid()?'':'disabled'}>Show My Results →</button></div><div class="footer-note">By continuing, you agree that Varsity Visa may contact you about your study abroad enquiry.</div></div></div>`}
function resultsScreen(){let r=state.results;let avg=r.length?Math.round(r.reduce((s,x)=>s+(x.tuition||0),0)/r.filter(x=>x.tuition).length):0;let best=r[0];return `<div><div class="hero" style="border-radius:0 0 28px 28px"><div class="brand" style="margin-bottom:18px"><div class="logo">🎓</div><div><div class="brand-title">Your StudyMatch Results</div><div class="brand-sub">${state.lead.firstName||'Student'} · ${labelForCat(state.form.cat)}</div></div></div><div class="chips"><span class="badge b-red">${r.length} matches</span><span class="badge b-navy">${BUDGETS.find(b=>b.id===state.form.budget).label}</span><span class="badge b-green">${QUALS.find(q=>q.id===state.form.qual).label}</span></div></div><div class="panel"><div class="kpis"><div class="kpi"><small>Best match</small><b>${best?best.match+'%':'0%'}</b></div><div class="kpi"><small>Lowest tuition</small><b>${money(Math.min(...r.filter(x=>x.tuition).map(x=>x.tuition)))}</b></div><div class="kpi"><small>Average</small><b>${money(avg)}</b></div></div>${state.form.timeline==='asap'?'<div class="notice">ASAP selected: Poland and Lithuania may still appear, but their match percentage is reduced because visa/TRP timelines can be longer.</div>':''}${docBox(r)}${r.map(card).join('')}<div class="card"><h2 class="section-title" style="font-size:18px">Ready to begin?</h2><p class="muted">Send your selected option to Varsity Visa on WhatsApp for the next step.</p><a class="btn btn-wa" target="_blank" rel="noopener noreferrer" href="${whatsapp('Hi Varsity Visa, I completed StudyMatch. My programme is '+labelForCat(state.form.cat)+' and my budget is '+BUDGETS.find(b=>b.id===state.form.budget).label+'. Please help me choose the best option.')}">WhatsApp Varsity Visa</a></div><div class="footer-note"><b>Important:</b> Fees, intakes, visa rules and scholarships can change. Final requirements must be verified before application submission. Data displayed here is generated from the uploaded Varsity Visa database.</div><button class="btn btn-ghost" onclick="restart()" style="margin-top:12px">Start over</button></div>${compareBar()}${state.selected?modal(state.selected):''}${state.compare.length>=2?compareModal():''}</div>`}
function docBox(r){let countries=[...new Set(r.map(x=>x.country))].slice(0,3);let items=[];countries.forEach(c=>(COUNTRY_DOCS[c]||[]).slice(0,3).forEach(d=>items.push(`${c}: ${d}`)));return `<div class="card" style="margin-bottom:14px"><h2 class="section-title" style="font-size:18px">Likely document checklist</h2><div class="chips">${items.slice(0,9).map(i=>`<span class="badge b-grey">✓ ${i}</span>`).join('')}</div></div>`}
function card(u,i){let pct=`${u.match*3.6}deg`;let within=u.tuition<=BUDGETS.find(b=>b.id===state.form.budget).max;return `<div class="result"><div class="result-head"><div class="result-top"><div><span class="badge b-red">#${i+1} · ${u.match}% match</span><h3>${u.programme}</h3><div class="city">${u.university} · ${u.city}, ${u.country} ${COUNTRY_FLAGS[u.country]||''}</div></div><div class="score-ring" style="--pct:${pct}"><span>${u.match}%</span></div></div><div class="chips"><span class="badge ${within?'b-green':'b-gold'}">${within?'Within budget':'Above budget'}</span>${lower(u.euRecognition).includes('yes')?'<span class="badge b-green">EU Recognition</span>':''}${lower(u.scholarship).includes('yes')?'<span class="badge b-gold">Scholarship</span>':''}</div></div><div class="result-body"><div class="facts"><div class="fact"><small>Tuition/year</small><b>${u.tuitionText||money(u.tuition)}</b></div><div class="fact"><small>Duration</small><b>${u.duration}</b></div><div class="fact"><small>Deadline</small><b>${u.deadline||'TBC'}</b></div></div><div class="facts"><div class="fact"><small>Intakes</small><b>${u.intakes||'TBC'}</b></div><div class="fact"><small>Visa fee</small><b>${u.visaFee||'TBC'}</b></div><div class="fact"><small>App fee</small><b>${u.applicationFee||'TBC'}</b></div></div><p class="muted"><b>Entry:</b> ${u.entry||'TBC'}<br><b>English:</b> ${u.ielts||'TBC'}</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><button class="btn btn-navy" onclick="state.selected='${u.country}|${u.university.replace(/'/g,"\'")}|${u.programme.replace(/'/g,"\'")}';render()">View details</button><a class="btn btn-wa" target="_blank" rel="noopener noreferrer" href="${whatsapp('Hi Varsity Visa, I am interested in '+u.programme+' at '+u.university+' in '+u.country+'. Tuition shown: '+(u.tuitionText||money(u.tuition))+'.')}">WhatsApp</a></div><button class="btn btn-ghost" onclick="toggleCompare(${i})" style="width:100%;margin-top:8px">${state.compare.includes(i)?'✓ Added to comparison':'+ Compare this option'}</button><div class="source">✓ Source / last verified: ${u.source||'Not stated in database'}</div></div></div>`}
function findSel(key){let [c,u,p]=key.split('|'); return state.results.find(x=>x.country===c&&x.university===u&&x.programme===p)}
function modal(key){let u=findSel(key); if(!u)return''; return `<div class="modal" onclick="state.selected=null;render()"><div class="modal-panel" onclick="event.stopPropagation()"><div style="display:flex;justify-content:space-between;gap:10px"><div><span class="badge b-red">${u.match}% match</span><h2 class="section-title" style="margin-top:8px">${u.programme}</h2><p class="muted">${u.university} · ${u.city}, ${u.country}</p></div><button class="btn btn-ghost" onclick="state.selected=null;render()">×</button></div><table><tr><th>Item</th><th>Details</th></tr><tr><td>Tuition</td><td>${u.tuitionText}</td></tr><tr><td>Total cost</td><td>${u.totalCostText}</td></tr><tr><td>Application fee</td><td>${u.applicationFee}</td></tr><tr><td>Visa fee</td><td>${u.visaFee}</td></tr><tr><td>Intake</td><td>${u.intakes}</td></tr><tr><td>Deadline</td><td>${u.deadline}</td></tr><tr><td>IELTS</td><td>${u.ielts}</td></tr><tr><td>Entry</td><td>${u.entry}</td></tr><tr><td>Scholarship</td><td>${u.scholarship}</td></tr><tr><td>EU Recognition</td><td>${u.euRecognition}</td></tr></table><a class="btn btn-wa" target="_blank" rel="noopener noreferrer" style="width:100%;margin-top:14px" href="${whatsapp('Hi Varsity Visa, I want to start an application for '+u.programme+' at '+u.university+', '+u.country+'.')}">Start on WhatsApp</a></div></div>`}
function compareBar(){if(!state.compare.length)return'';let picks=state.compare.map(i=>state.results[i]).filter(Boolean); return `<div class="compare-bar"><div style="font-size:11px;font-weight:950;color:var(--navy);margin-bottom:6px">Compare selected (${picks.length}/3)</div>${picks.map((u,idx)=>`<span class="compare-pill">${u.country} · ${u.university} <button onclick="toggleCompare(${state.compare[idx]})" style="border:0;background:none;color:var(--red);font-weight:950">×</button></span>`).join('')}<button class="btn btn-primary" onclick="render()" ${picks.length<2?'disabled':''} style="width:100%;padding:12px">Comparison appears below</button></div>`}
function compareModal(){let picks=state.compare.map(i=>state.results[i]).filter(Boolean);return `<div class="panel"><div class="card"><h2 class="section-title" style="font-size:18px">Side-by-side comparison</h2><table><thead><tr><th>Metric</th>${picks.map(u=>`<th>${u.country}</th>`).join('')}</tr></thead><tbody><tr><td>University</td>${picks.map(u=>`<td>${u.university}</td>`).join('')}</tr><tr><td>Programme</td>${picks.map(u=>`<td>${u.programme}</td>`).join('')}</tr><tr><td>Match</td>${picks.map(u=>`<td>${u.match}%</td>`).join('')}</tr><tr><td>Tuition</td>${picks.map(u=>`<td>${u.tuitionText}</td>`).join('')}</tr><tr><td>Deadline</td>${picks.map(u=>`<td>${u.deadline}</td>`).join('')}</tr><tr><td>IELTS</td>${picks.map(u=>`<td>${u.ielts}</td>`).join('')}</tr></tbody></table></div></div>`}
function render(){let s=document.getElementById('screen'); s.innerHTML= state.step===0?landing():state.step===1?step1():state.step===2?step2():state.step===3?step3():state.step===4?step4():state.step===5?previewScreen():state.step===6?leadScreen():resultsScreen(); window.scrollTo({top:0,behavior:'smooth'});}
function go(n){state.step=n;render()} function setCat(x){state.form.cat=x;go(2)} function setBudget(x){state.form.budget=x;go(3)} function setQual(x){state.form.qual=x;go(4)} 
function isValidName(v){v=String(v||'').trim();return v.length>=2 && /^[A-Za-zÀ-ÖØ-öø-ÿ' -]+$/.test(v) && /[A-Za-zÀ-ÖØ-öø-ÿ]/.test(v)}
function isValidEmail(v){v=String(v||'').trim();return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)}
function isValidPhone(v){let d=String(v||'').replace(/\D/g,'');return d.length>=9 && d.length<=15}
function isLeadValid(){return isValidName(state.lead.firstName)&&isValidName(state.lead.surname)&&isValidPhone(state.lead.whatsapp)&&isValidEmail(state.lead.email)}
function leadErrors(){let e=[]; if(!isValidName(state.lead.firstName))e.push('First name must have at least 2 letters.'); if(!isValidName(state.lead.surname))e.push('Surname must have at least 2 letters.'); if(!isValidPhone(state.lead.whatsapp))e.push('WhatsApp number must have 9–15 digits.'); if(!isValidEmail(state.lead.email))e.push('Email must look like name@example.com.'); return e.join('\n')}

function enableLead(){let b=document.getElementById('leadBtn'); if(b)b.disabled=!isLeadValid()} function saveLead() {

  const payload = {
    firstName: state.lead.firstName,
    surname: state.lead.surname,
    whatsapp: state.lead.whatsapp,
    email: state.lead.email,
    programme: state.form.programme,
    budget: state.form.budget,
    qualification: state.form.qualification,
    timeline: state.form.timeline,
    recommendations: state.results.map(r => r.name).join(", ")
  };

  // Save locally as backup
  try {
    const existing = JSON.parse(localStorage.getItem("varsityVisaLeads") || "[]");
    existing.push(payload);
    localStorage.setItem("varsityVisaLeads", JSON.stringify(existing));
  } catch(e) {}

  // Send to Google Sheets
  fetch("https://script.google.com/macros/s/AKfycbwtNvHM3lQ5_vx1pNfRphuA4MFfxBEqivjPAkn-7SpzNAU7Cd5hBoGS4StE7vzNRmvC/exec", {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify(payload)
  });

}{if(!isLeadValid()){alert(leadErrors());return;}saveLead()https://script.google.com/macros/s/AKfycbwtNvHM3lQ5_vx1pNfRphuA4MFfxBEqivjPAkn-7SpzNAU7Cd5hBoGS4StE7vzNRmvC/exec;go(7)} function toggleCompare(i){let ix=state.compare.indexOf(i); if(ix>=0)state.compare.splice(ix,1); else {if(state.compare.length>=3){alert('You can compare up to 3 options.');return} state.compare.push(i)} render()} function restart(){state={step:0,form:{cat:"nursing",budget:"5000",qual:"a",timeline:"mid",country:"Any",ielts:"No"},lead:{firstName:"",surname:"",whatsapp:"",email:""},results:[],compare:[],selected:null};render()}
render();
</script>
